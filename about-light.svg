<clipPath id="about"><rect x="0" y="78" width="400" height="66"/></clipPath><g clip-path="url(#about)"><g>
<g transform="translate(20 94)"><g class="fade" style="animation-delay: 290ms"><text class="label secondary">Engenheiro de software sênior há 8 anos</text></g></g>
<g transform="translate(20 116)"><g class="fade" style="animation-delay: 380ms"><text class="label secondary">Levo IA generativa ao ambiente de produção</text></g></g>
<g transform="translate(20 138)"><g class="fade" style="animation-delay: 470ms"><text class="label secondary">Tech lead de um time de 8 pessoas</text></g></g>
</g></g>
<g class="fact" style="animation-delay: 0.00s"><g transform="translate(20 160)"><g class="fade" style="animation-delay: 560ms"><text class="col">STACK</text><text x="50" class="label">C#, .NET, Azure, Elasticsearch</text></g></g></g>
<g class="fact" style="animation-delay: 4.30s"><g transform="translate(20 160)"><g class="fade" style="animation-delay: 560ms"><text class="col">FOCO</text><text x="50" class="label">RAG, LLM e plataforma de engenharia</text></g></g></g>
